/**:
  ros__parameters:
    # IMU (Bosch BNO055)
    imu:
      rate: 100.0               # [Hz]
      gyro_noise_std: 0.0024    # [rad/s]
      gyro_bias: 0.0175         # [rad/s]
      gyro_bias_std: 0.002      # [rad/s]
      accel_noise_std: 0.019    # [m/s^2]
      accel_bias: 0.785         # [m/s^2]
      accel_bias_std: 0.08      # [m/s^2]

    # Lidar (Slamtec RPLidar C1)
    lidar:
      rate: 10.0                # [Hz]
      range_min: 0.05           # [m]
      range_max: 12.0           # [m]
      samples: 500              # [const]
      angle_min: -3.14159       # [rad]
      angle_max: 3.12903        # [rad]
      range_noise_std: 0.015    # [m]
