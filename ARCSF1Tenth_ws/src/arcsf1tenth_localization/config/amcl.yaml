/**/amcl:
  ros__parameters:
    # Motion model
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.1                 # [const]
    alpha2: 0.1                 # [const]
    alpha3: 0.1                 # [const]
    alpha4: 0.1                 # [const]
    alpha5: 0.1                 # [const]

    # Update rate
    update_min_d: 0.05          # [m]
    update_min_a: 0.05          # [rad]
    resample_interval: 1        # [const]

    # Particles
    min_particles: 500          # [const]
    max_particles: 3000         # [const]
    pf_err: 0.05                # [const]
    pf_z: 0.99                  # [const]
    recovery_alpha_slow: 0.0    # [const]
    recovery_alpha_fast: 0.0    # [const]

    # Laser model
    laser_model_type: "likelihood_field"
    max_beams: 120              # [const]
    laser_min_range: 0.3        # [m]
    laser_max_range: 12.0       # [m]
    laser_likelihood_max_dist: 1.0  # [m]
    z_hit: 0.9                  # [const]
    z_rand: 0.1                 # [const]
    z_max: 0.05                 # [const]
    z_short: 0.05               # [const]
    sigma_hit: 0.1              # [m]
    lambda_short: 0.1           # [const]
    do_beamskip: false

    # Output
    tf_broadcast: true
    transform_tolerance: 0.2    # [s]
    save_pose_rate: 0.5         # [Hz]
    always_reset_initial_pose: false
    first_map_only: false
