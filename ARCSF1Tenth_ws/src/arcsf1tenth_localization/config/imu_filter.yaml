/**/imu_filter:
  ros__parameters:
    # Startup calibration
    calibration_seconds: 3.0      # [s]
    calibration_timeout: 15.0     # [s]

    # Standstill detection
    still_speed: 0.05             # [m/s]
    still_gyro: 0.05              # [rad/s]

    # ZUPT
    zupt_enabled: true
    zupt_settle_time: 0.5         # [s]
    zupt_alpha: 0.01              # [const]

    # Gyro filter
    project_to_horizontal: false
    gyro_median_window: 1         # [const]
    gyro_ma_window: 1             # [const]

    # Covariance
    min_variance: 1.0e-8          # [const]
