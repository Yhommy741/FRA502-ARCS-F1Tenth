# slam_toolbox for the ARCS F1Tenth car (mapping and localization).
# Based on slam_toolbox's mapper_params_online_async.yaml; lines marked <- differ from it.
#
# Set by simulation.launch.py (from the namespace / slam arguments), so not in this file:
#   odom_frame, map_frame, base_frame, scan_topic, map_name, mode, map_file_name,
#   map_start_pose, use_sim_time
/**/slam_toolbox:
  ros__parameters:
    # Solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    use_map_saver: true
    debug_logging: false
    throttle_scans: 1                          # use every scan (lidar is only 10 Hz)
    transform_publish_period: 0.02             # publish map -> odom at 50 Hz
    map_update_interval: 2.0                   # <- 5.0: redraw the map in RViz more often
    resolution: 0.05                           # 5 cm cells (same as the F1Tenth maps)
    min_laser_range: 0.05                      # <- 0.0: RPLidar C1 minimum (sensors.yaml)
    max_laser_range: 12.0                      # <- 20.0: RPLidar C1 maximum (sensors.yaml)
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000                # needed to serialize large maps
    enable_interactive_mode: true

    # When to add a new scan to the map
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3               # <- 0.5: small car, tight corridors -> more scans
    minimum_travel_heading: 0.3                # <- 0.5 rad: more scans in corners
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 12.0    # <- 10.0: match the lidar range
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # Loop closure: fixes accumulated drift when the car comes back to a known place
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Scan matcher: searches +-0.25 m around the odometry guess (good odometry matters)
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
