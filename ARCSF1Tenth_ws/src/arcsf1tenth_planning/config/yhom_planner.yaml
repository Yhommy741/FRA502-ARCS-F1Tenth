/**/yhom_local_planner:
  ros__parameters:
    rate: 10.0                  # [Hz]
    horizon: 12.0               # [m]
    step: 0.1                   # [m]

    # Candidate maneuvers
    maneuver_lengths: [3.0, 4.0, 5.0, 6.0, 8.0]   # [m]
    min_maneuver_time: 0.8      # [s]
    d_step: 0.1                 # [m]

    # Safety
    wall_margin: 0.15           # [m]
    obstacle_margin: 0.25       # [m]
    clearance_preferred: 0.5    # [m]
    replan_distance: 0.3        # [m]
    obstacle_timeout: 0.5       # [s]

    # Speed
    max_lateral_accel: 4.0      # [m/s^2]
    avoid_speed_max: 2.0        # [m/s]

    # Cost weights
    w_jerk: 1.0                 # [const]
    w_offset: 2.0               # [const]
    w_length: 1.0               # [const]
    w_consistency: 1.0          # [const]
    w_clearance: 20.0           # [const]

/**/yhom_state_machine:
  ros__parameters:
    rate: 20.0                  # [Hz]

    # Trigger
    trigger_distance: 3.0       # [m]
    trigger_time: 1.5           # [s]
    corridor_margin: 0.25       # [m]

    # Transitions
    return_d: 0.15              # [m]
    min_avoid_time: 1.0         # [s]
    clear_time: 0.5             # [s]
    release_distance: 2.0       # [m]
    timeout: 0.5                # [s]

    # Blocked
    stop_distance: 1.0          # [m]
    brake_decel: 2.0            # [m/s^2]

    # Global window
    global_ahead: 12.0          # [m]
    global_behind: 1.0          # [m]
    global_step: 0.1            # [m]
