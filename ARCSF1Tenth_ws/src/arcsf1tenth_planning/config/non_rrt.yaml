/**/non_rrt_planner:
  ros__parameters:
    rate: 10.0                  # [Hz]
    odom_topic: odometry/estimated

    # Obstacle detection
    detect_wall_margin: 0.3     # [m]
    detect_range_gain: 0.035    # [m/m]
    max_range: 6.0              # [m]
    neighbor_radius: 0.2        # [m]
    min_neighbors: 2            # [const]
    obstacle_timeout: 0.5       # [s]

    # Collision check
    wall_margin: 0.05           # [m]
    obstacle_margin: 0.2        # [m]
    escape_margin: 0.05         # [m]

    # Trigger and goal
    check_distance: 3.0         # [m]
    check_time: 1.5             # [s]
    goal_after_obstacle: 2.0    # [m]
    min_goal_distance: 4.0      # [m]
    max_goal_distance: 10.0     # [m]
    sample_width: 1.2           # [m]

    # Kinodynamic RRT
    steer_margin: 0.9           # [const]
    steer_rate_margin: 0.7      # [const]
    edge_length: 0.5            # [m]
    integration_step: 0.05      # [m]
    n_controls: 7               # [const]
    goal_bias: 0.3              # [const]
    goal_tolerance: 0.4         # [m]
    goal_depth: 1.0             # [m]
    goal_yaw_tolerance: 0.4     # [rad]
    w_heading: 1.0              # [m/rad]
    w_steer: 0.2                # [m/rad]
    max_fails: 3                # [const]
    max_nodes: 2000             # [const]
    max_iterations: 4000        # [const]
    refine_iterations: 100      # [const]
    time_budget: 0.08           # [s]

    # Following the plan
    replan_distance: 0.4        # [m]
    merge_length: 3.0           # [m]
    avoid_speed_max: 2.0        # [m/s]
    min_plan_speed: 1.0         # [m/s]
    max_lateral_accel: 4.0      # [m/s^2]
    stop_distance: 0.5          # [m]
    brake_decel: 2.0            # [m/s^2]
    global_ahead: 12.0          # [m]
    global_behind: 1.0          # [m]
    publish_tree: true

/**/non_rrt_tracker:
  ros__parameters:
    rate: 50.0                  # [Hz]
    trajectory_timeout: 0.5     # [s]
    controller: rear_wheel_feedback

    # Rear wheel feedback
    settle_time: 0.5            # [s]
    settle_distance_min: 0.6    # [m]
    preview_time: 0.1           # [s]

    # Pure pursuit
    lookahead_min: 0.6          # [m]
    lookahead_max: 1.8          # [m]
    lookahead_gain: 0.35        # [s]
    speed_scale: 1.0            # [const]
    speed_min: 0.3              # [m/s]
    max_tracking_error: 1.0     # [m]
