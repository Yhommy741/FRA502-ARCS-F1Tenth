# non_controller.launch.py: non_obstacle_detector -> non_state_machine <-> non_rrt_node -> pure_pursuit
# (pure_pursuit uses arcsf1tenth_control/config/pure_pursuit.yaml, shared with yhom_controller)

# Shared by all nodes that load this file
/**:
  ros__parameters:
    rate: 10.0                  # [Hz] non_state_machine cycle (non_rrt_node uses it for the lead-in)
    obstacle_margin: 0.3        # [m] car edge to obstacle point (0.2 + room for pure pursuit corner cutting)

/**/non_obstacle_detector:
  ros__parameters:
    max_range: 6.0              # [m]
    detect_wall_margin: 0.3     # [m]
    detect_range_gain: 0.035    # [m/m] 0 = fixed margin (like obstacle_detector)
    cluster_gap: 0.3            # [m]
    min_points: 3               # [const]
    max_size: 2.0               # [m]
    track_filter: true
    track_margin: 0.1           # [m]

/**/non_state_machine:
  ros__parameters:
    odom_topic: odometry/estimated
    obstacle_timeout: 0.5       # [s]

    # Trigger
    check_distance: 3.0         # [m]
    check_time: 1.5             # [s]

    # Following the plan
    replan_distance: 0.4        # [m]
    stop_distance: 0.5          # [m]
    brake_decel: 2.0            # [m/s^2]
    global_ahead: 12.0          # [m]
    global_behind: 1.0          # [m]
    request_timeout: 1.0        # [s]

/**/non_rrt_node:
  ros__parameters:
    # Collision check
    wall_margin: 0.05           # [m]
    escape_margin: 0.05         # [m]

    # Goal and sampling
    goal_after_obstacle: 2.0    # [m]
    min_goal_distance: 4.0      # [m]
    max_goal_distance: 10.0     # [m]
    sample_width: 1.2           # [m]

    # Kinodynamic RRT
    steer_margin: 0.9           # [const]
    steer_rate_margin: 0.7      # [const]
    edge_length: 1.5            # [m]
    integration_step: 0.05      # [m]
    n_controls: 7               # [const]
    goal_bias: 0.1              # [const]
    goal_tolerance: 0.4         # [m]
    goal_depth: 1.0             # [m]
    goal_yaw_tolerance: 0.4     # [rad]
    w_heading: 1.0              # [m/rad]
    w_steer: 0.2                # [m/rad]
    max_fails: 3                # [const]
    max_nodes: 2000             # [const]
    max_iterations: 4000        # [const]
    refine_iterations: 100      # [const]
    time_budget: 0.08           # [s]

    # Detour
    merge_length: 3.0           # [m]
    avoid_speed_max: 2.0        # [m/s]
    min_plan_speed: 1.0         # [m/s]
    max_lateral_accel: 4.0      # [m/s^2]
    publish_tree: true
