/**/pure_pursuit:
  ros__parameters:
    rate: 50.0                  # [Hz]

    # Lookahead
    lookahead_min: 0.6          # [m]
    lookahead_max: 2.0          # [m]
    lookahead_gain: 0.35        # [s]

    # Speed
    speed_scale: 1.0            # [const]
    speed_max: 3.0              # [m/s]
    speed_min: 0.5              # [m/s]

    # Safety
    max_tracking_error: 1.0     # [m]
    search_window: 5.0          # [m]
